<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERRES — Phone Preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#0a0a0b;
    font-family:-apple-system,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:40px 20px;
    background-image:radial-gradient(80% 60% at 50% 0%,rgba(46,50,63,.35),transparent 70%);
  }
  #root{display:flex;align-items:center;justify-content:center}
  .scaler{transform-origin:center center}
  /* the iframe that holds the live site */
  .site-frame{
    width:100%;height:100%;border:0;display:block;background:#0a0a0b;
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="frames/ios-frame.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  function App(){
    const ref = React.useRef(null);
    React.useEffect(()=>{
      const fit=()=>{
        const margin=48;
        const s=Math.min(1,(window.innerHeight-margin)/874,(window.innerWidth-margin)/402);
        if(ref.current) ref.current.style.transform='scale('+s+')';
      };
      fit();
      window.addEventListener('resize',fit);
      return ()=>window.removeEventListener('resize',fit);
    },[]);
    return (
      <div className="scaler" ref={ref}>
        <IOSDevice dark width={402} height={874}>
          <iframe className="site-frame" src="SERRES.html" title="SERRES mobile"></iframe>
        </IOSDevice>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
